name: lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bash-syntax:
    name: bash -n syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n all scripts
        run: |
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash syntax error"
              fail=1
            fi
          done < <(find adapters integrations scripts -name '*.sh')
          exit $fail

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    env:
      # Pinned so CI and local development agree on which warnings exist (the
      # version shipped with ubuntu-latest drifts). To upgrade: bump the version
      # and set the sha256 of shellcheck-<version>.linux.x86_64.tar.xz, which
      # GitHub shows as the asset digest on the release page.
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@v4

      - name: install pinned shellcheck
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/$archive"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/shellcheck"
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/shellcheck" \
            --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP/shellcheck" >> "$GITHUB_PATH"

      - name: shellcheck all scripts
        run: |
          shellcheck --version
          find adapters integrations scripts -name '*.sh' -print0 \
            | xargs -0 -r shellcheck -x

  workforce-schema:
    name: workforce schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: install validator
        run: pip install jsonschema

      - name: validate workforces against schema
        run: |
          python3 - << 'EOF'
          import glob, json, sys
          from jsonschema import Draft7Validator

          schema = json.load(open("workforces/workforce.schema.json"))
          Draft7Validator.check_schema(schema)
          validator = Draft7Validator(schema)

          fail = False
          for path in sorted(glob.glob("workforces/*.json")):
              # the schema itself lives in workforces/ too — don't validate it against itself
              if path.endswith("workforce.schema.json"):
                  continue
              data = json.load(open(path))
              errors = sorted(validator.iter_errors(data), key=lambda e: list(e.path))
              if errors:
                  fail = True
                  for e in errors:
                      loc = "/".join(map(str, e.path)) or "(root)"
                      print(f"::error file={path}::{loc}: {e.message}")
              else:
                  print(f"{path}: ok")
          sys.exit(1 if fail else 0)
          EOF

  tests:
    name: test scripts
    runs-on: ubuntu-latest
    env:
      STEP_DELAY: '0'
    steps:
      - uses: actions/checkout@v4

      - name: configure git identity
        run: |
          git config --global user.name  "ci"
          git config --global user.email "ci@example.invalid"

      - name: test-flow
        run: bash scripts/test-flow.sh

      - name: test-drain
        run: bash scripts/test-drain.sh

      - name: test-base-branch
        run: bash scripts/test-base-branch.sh

      - name: test-wf-read
        run: bash scripts/test-wf-read.sh

      - name: test-adapter-briefing
        run: bash scripts/test-adapter-briefing.sh

      - name: test-worker-spawn
        run: bash scripts/test-worker-spawn.sh

      - name: test-stage-start
        run: bash scripts/test-stage-start.sh

      - name: test-artifact-ledger
        run: bash scripts/test-artifact-ledger.sh

      - name: test-artifact-name
        run: bash scripts/test-artifact-name.sh

      - name: test-conductor-script-refs
        run: bash scripts/test-conductor-script-refs.sh

      - name: test-dispatch-prompt
        run: bash scripts/test-dispatch-prompt.sh

      - name: test-conductor-loop
        run: bash scripts/test-conductor-loop.sh
